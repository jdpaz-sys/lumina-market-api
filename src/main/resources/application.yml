spring:
  application:
    name: lumina-market-api

  # 1. Configuración de la Base de Datos (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/lumina_market
    username: postgres
    password: postgre
    driver-class-name: org.postgresql.Driver

  # 2. Configuración de JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 3. Configuración de Flyway (Migraciones de BD)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 4. Configuración del Servidor
server:
  port: 8080